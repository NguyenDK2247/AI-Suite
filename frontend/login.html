<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — AI Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/auth.css" />
</head>

<body>
    <div class="auth-card">

        <div class="auth-logo">
            <div class="auth-logo-icon">🤖</div>
            <h1>Welcome back</h1>
            <p>Sign in to your AI Suite account</p>
        </div>

        <div class="banner error" id="error-banner"></div>

        <div class="auth-form">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="your_username" autocomplete="username"
                    autocapitalize="none" />
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
            </div>

            <button class="auth-btn" id="login-btn" onclick="doLogin()">Sign in</button>
        </div>

        <div class="auth-footer">
            Don't have an account? <a href="/signup">Sign up</a>
        </div>

    </div>

    <script>
        const usernameEl = document.getElementById('username');
        const passwordEl = document.getElementById('password');
        const loginBtn = document.getElementById('login-btn');
        const errorBanner = document.getElementById('error-banner');

        // Allow Enter key on both fields
        [usernameEl, passwordEl].forEach(el =>
            el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.className = 'banner error show';
        }

        function clearError() {
            errorBanner.className = 'banner error';
            usernameEl.classList.remove('error');
            passwordEl.classList.remove('error');
        }

        async function doLogin() {
            clearError();
            const username = usernameEl.value.trim();
            const password = passwordEl.value;

            if (!username) { usernameEl.classList.add('error'); showError('Please enter your username.'); usernameEl.focus(); return; }
            if (!password) { passwordEl.classList.add('error'); showError('Please enter your password.'); passwordEl.focus(); return; }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in…';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.ok) {
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Login failed.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign in';
                }
            } catch {
                showError('Could not reach the server. Please try again.');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign in';
            }
        }
    </script>
</body>

</html>
