<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Assistant</title>
  <meta name="description"
    content="AI-powered weather chatbot with hourly forecasts, powered by Groq and OpenWeatherMap." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="app">

    <!-- ── Chat panel ─────────────────────────────── -->
    <div class="chat-panel">
      <div class="chat-header">
        <div class="status-dot"></div>
        <h1>Weather Assistant</h1>
        <small>Groq · OpenWeatherMap</small>
      </div>

      <div id="log"></div>

      <div class="chips" id="chips">
        <span class="chip" onclick="quickSend('What is the weather in Tokyo?')">🗼 Tokyo</span>
        <span class="chip" onclick="quickSend('How is the weather in London right now?')">🇬🇧 London</span>
        <span class="chip" onclick="quickSend('Weather in New York for the next 9 hours')">🗽 New York</span>
        <span class="chip" onclick="quickSend('Weather in Sydney')">🦘 Sydney</span>
        <span class="chip" onclick="quickSend('What is the weather in Hanoi for the next 6 hours?')">🇻🇳 Hanoi</span>
      </div>

      <div class="input-row">
        <input id="input" type="text" placeholder="Ask about weather in any city…" autocomplete="off"
          onkeydown="if(event.key==='Enter') send()" />
        <button id="btn" onclick="send()">Send</button>
      </div>
    </div>

    <!-- ── History panel ──────────────────────────── -->
    <div class="history-panel">
      <div class="history-header">
        <h2>Chat History</h2>
        <div style="display: flex; gap: 8px;">
          <button id="theme-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">☀️</button>
          <button id="clear-btn" onclick="clearHistory()">Clear</button>
        </div>
      </div>
      <div class="persist-badge">Saved locally — survives server restarts</div>
      <div class="hist-search-wrap">
        <input type="text" id="hist-search" class="hist-search" placeholder="Search history..."
          oninput="renderHistory(this.value)" />
      </div>
      <div id="history-list"></div>
    </div>

  </div>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const btn = document.getElementById('btn');
    const historyList = document.getElementById('history-list');

    const STORAGE_KEY = 'weather_chat_history';

    /* ── Helpers ──────────────────────────────────── */

    function now() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function nowFull() {
      return new Date().toLocaleString([], {
        month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function getWeatherEmoji(desc) {
      const d = desc.toLowerCase();
      if (d.includes('thunderstorm')) return '⛈️';
      if (d.includes('drizzle') || d.includes('rain')) return '🌧️';
      if (d.includes('snow')) return '❄️';
      if (d.includes('clear')) return '☀️';
      if (d.includes('clouds')) {
        if (d.includes('few') || d.includes('scattered')) return '🌤️';
        return '☁️';
      }
      if (d.includes('mist') || d.includes('smoke') || d.includes('haze') || d.includes('fog')) return '🌫️';
      return '🌡️';
    }

    /* ── Chat rendering ───────────────────────────── */

    function addMsg(role, html, time) {
      const outer = document.createElement('div');
      outer.className = 'msg ' + role;

      const ts = time || now();

      outer.innerHTML = `
      <div class="avatar">${role === 'user' ? 'You' : 'AI'}</div>
      <div class="bubble-wrap">
        <span class="ts">${ts}</span>
        <div class="bubble" id="bubble-${Date.now()}">${html}</div>
      </div>`;

      log.appendChild(outer);
      log.scrollTop = log.scrollHeight;
      return outer.querySelector('.bubble');
    }

    function typingBubble() {
      const outer = document.createElement('div');
      outer.className = 'msg bot';
      outer.id = 'typing-indicator';
      outer.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble-wrap">
        <span class="ts">${now()}</span>
        <div class="bubble">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      </div>`;
      log.appendChild(outer);
      log.scrollTop = log.scrollHeight;
      return outer;
    }

    /* ── Persistence ──────────────────────────────── */

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function saveHistory(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries.slice(-60)));
    }

    function renderHistory(query = '') {
      let entries = loadHistory().map((e, idx) => ({ ...e, originalIndex: idx }));
      if (query) {
        const q = query.toLowerCase();
        entries = entries.filter(e => e.question.toLowerCase().includes(q) || e.answer.toLowerCase().includes(q));
      }
      historyList.innerHTML = '';

      if (entries.length === 0) {
        historyList.innerHTML = query
          ? '<p class="hist-empty">No matches found for your search.</p>'
          : '<p class="hist-empty">No history yet.<br>Start chatting to see<br>your conversations here.</p>';
        return;
      }

      [...entries].reverse().forEach((entry) => {
        const item = document.createElement('div');
        item.className = 'hist-item';
        item.innerHTML = `
        <div class="hist-time">
          <span>${entry.time}</span>
          <button class="hist-del" title="Delete this conversation">✖</button>
        </div>
        <div class="hist-q">${escHtml(entry.question)}</div>
        <div class="hist-a">${escHtml(entry.answer)}</div>`;
        item.title = 'Click to view full answer in chat';

        const delBtn = item.querySelector('.hist-del');
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteHistoryItem(entry.originalIndex);
        };

        item.onclick = () => {
          addMsg('user', escHtml(entry.question), entry.time);
          const completeBotHtml = buildBotMessageHtml(entry.answer, entry.weatherData);
          addMsg('bot', completeBotHtml, entry.time);
        };
        historyList.appendChild(item);
      });
    }

    function deleteHistoryItem(index) {
      const entries = loadHistory();
      entries.splice(index, 1);
      saveHistory(entries);
      const searchBox = document.getElementById('hist-search');
      renderHistory(searchBox ? searchBox.value : '');
    }

    function addToHistory(question, answer, weatherData = null) {
      const entries = loadHistory();
      entries.push({ time: nowFull(), question, answer, weatherData });
      saveHistory(entries);
      const searchBox = document.getElementById('hist-search');
      renderHistory(searchBox ? searchBox.value : '');
    }

    function clearHistory() {
      if (!confirm('Clear all chat history?')) return;
      localStorage.removeItem(STORAGE_KEY);
      const searchBox = document.getElementById('hist-search');
      if (searchBox) searchBox.value = '';
      renderHistory();
    }

    function escHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function buildBotMessageHtml(replyText, wd) {
      let weatherHtml = '';
      if (wd) {
        if (wd.forecast) {
          let items = wd.forecast.map(f => `
              <div class="wc-forecast-item">
                  <div class="wc-forecast-time">${f.time.split(' ')[1].substring(0, 5)}</div>
                  <div class="wc-forecast-emoji" style="font-size: 24px; margin: 4px 0;">${getWeatherEmoji(f.description)}</div>
                  <div class="wc-forecast-temp">${Math.round(f.tempCelsius)}°</div>
                  <div class="wc-forecast-desc" title="${f.description}">${f.description}</div>
              </div>
          `).join('');
          weatherHtml = `
              <div class="weather-card">
                  <div class="wc-header">
                      <div class="wc-city">${wd.city} Forecast</div>
                  </div>
                  <div class="wc-forecast">${items}</div>
              </div>`;
        } else {
          weatherHtml = `
              <div class="weather-card">
                  <div class="wc-header">
                      <div class="wc-city">${wd.city}</div>
                      <div class="wc-desc">${wd.description}</div>
                  </div>
                  <div class="wc-main" style="display: flex; justify-content: space-between; align-items: center; margin: 8px 0;">
                      <div class="wc-temp">${Math.round(wd.tempCelsius)}°C</div>
                      <div class="wc-large-emoji" style="font-size: 44px; line-height: 1;">${getWeatherEmoji(wd.description)}</div>
                  </div>
                  <div class="wc-details">
                      <span>💧 ${wd.humidity}%</span>
                      <span>💨 ${wd.windSpeed} m/s</span>
                      <span>Feels like ${Math.round(wd.feelsLike)}°C</span>
                  </div>
              </div>`;
        }
      }
      return weatherHtml + `<div>${escHtml(replyText)}</div>`;
    }

    /* ── Send logic ───────────────────────────────── */

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';

      const sentTime = now();
      addMsg('user', escHtml(text), sentTime);

      const indicator = typingBubble();
      btn.disabled = true;

      let replyText = '';
      let rawText = '';
      let weatherDataPayload = null;

      const startTime = Date.now();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        rawText = data.reply || data.error || 'No response.';
        weatherDataPayload = data.weatherData || null;
      } catch (e) {
        rawText = 'Could not reach the server.';
      }

      const elapsedTime = Date.now() - startTime;
      const minimumDelay = 600;
      if (elapsedTime < minimumDelay) {
        await new Promise(resolve => setTimeout(resolve, minimumDelay - elapsedTime));
      }

      indicator.remove();

      const botMsgHtml = buildBotMessageHtml(rawText, weatherDataPayload);

      addMsg('bot', botMsgHtml);
      addToHistory(text, rawText, weatherDataPayload);

      btn.disabled = false;
      input.focus();
    }

    function quickSend(text) {
      input.value = text;
      send();
    }

    /* ── Theme Toggle ─────────────────────────────── */

    const themeBtn = document.getElementById('theme-btn');
    const THEME_KEY = 'weather_chat_theme';

    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === 'light') {
        document.body.classList.add('light-mode');
        themeBtn.textContent = '🌙';
      } else {
        themeBtn.textContent = '☀️';
      }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      themeBtn.textContent = isLight ? '🌙' : '☀️';
      localStorage.setItem(THEME_KEY, isLight ? 'light' : 'dark');
    }

    /* ── Boot ─────────────────────────────────────── */

    initTheme();
    renderHistory();
    addMsg('bot', 'Hi! Ask me about the weather anywhere in the world.\n\nTry: "What\'s the weather in Paris?" or "Weather in Tokyo for the next 6 hours?"');
  </script>
</body>

</html>
