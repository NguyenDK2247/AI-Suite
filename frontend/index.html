<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app">

    <!-- ── Left sidebar: tab switcher ───────────────────────────────────── -->
    <div class="sidebar">
      <div class="sidebar-logo">AI<br><span>Suite</span></div>
      <nav class="sidebar-nav">
        <a class="sidebar-tab active" href="/" title="Weather">
          <span class="tab-icon">🌤️</span>
          <span class="tab-label">Weather</span>
        </a>
        <a class="sidebar-tab" href="/currency" title="Currency">
          <span class="tab-icon">💱</span>
          <span class="tab-label">Currency</span>
        </a>
      </nav>
    </div>

    <!-- ── Chat panel ────────────────────────────────────────────────────── -->
    <div class="chat-panel">
      <div class="chat-header">
        <div class="status-dot"></div>
        <h1>Weather Assistant</h1>
        <small id="username-display" style="margin-left:auto;margin-right:8px"></small>
        <button onclick="doLogout()"
          style="font-size:11px;padding:3px 10px;border:1px solid var(--border);border-radius:6px;background:none;color:var(--muted);cursor:pointer;font-family:inherit"
          onmouseover="this.style.color='#f87171';this.style.borderColor='#f87171'"
          onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border)'">Logout</button>
      </div>

      <div id="log"></div>

      <div class="chips" id="chips">
        <span class="chip" onclick="quickSend('What is the weather in Tokyo?')">🗼 Tokyo</span>
        <span class="chip" onclick="quickSend('How is the weather in London right now?')">🇬🇧 London</span>
        <span class="chip" onclick="quickSend('Weather in New York for the next 9 hours')">🗽 New York</span>
        <span class="chip" onclick="quickSend('Weather in Sydney')">🦘 Sydney</span>
        <span class="chip" onclick="quickSend('What is the weather in Hanoi for the next 6 hours?')">🇻🇳 Hanoi</span>
      </div>

      <div class="input-row">
        <input id="input" type="text" placeholder="Ask about weather in any city…" autocomplete="off"
          onkeydown="if(event.key==='Enter') send()" />
        <button id="btn" onclick="send()">Send</button>
      </div>
    </div>

    <!-- ── History panel ─────────────────────────────────────────────────── -->
    <div class="history-panel">
      <div class="history-header">
        <h2>Chat History</h2>
        <div style="display:flex;gap:8px;">
          <button id="theme-btn" onclick="toggleTheme()" title="Toggle theme">☀️</button>
          <button id="clear-btn" onclick="clearHistory()">Clear</button>
        </div>
      </div>
      <div class="persist-badge">Saved locally — weather history only</div>
      <div class="hist-search-wrap">
        <input type="text" id="hist-search" class="hist-search" placeholder="Search history…"
          oninput="renderHistory(this.value)" />
      </div>
      <div id="history-list"></div>
    </div>

  </div>

  <script>
    const PAGE = 'weather';
    const THEME_KEY = 'app_theme';

    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const btn = document.getElementById('btn');
    const historyList = document.getElementById('history-list');
    const themeBtn = document.getElementById('theme-btn');

    // ── Helpers ─────────────────────────────────────────────────────────────────
    function now() { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
    function nowFull() { return new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    function escHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function utcToLocal(dtTxt) {
      const date = new Date(dtTxt.replace(' ', 'T') + 'Z');
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function getWeatherEmoji(desc) {
      const d = desc.toLowerCase();
      if (d.includes('thunderstorm')) return '⛈️';
      if (d.includes('drizzle') || d.includes('rain')) return '🌧️';
      if (d.includes('snow')) return '❄️';
      if (d.includes('clear')) return '☀️';
      if (d.includes('few') || d.includes('scattered')) return '🌤️';
      if (d.includes('clouds')) return '☁️';
      if (d.includes('mist') || d.includes('haze') || d.includes('fog')) return '🌫️';
      return '🌡️';
    }

    // ── Chat rendering ───────────────────────────────────────────────────────────
    function addMsg(role, html, time) {
      const outer = document.createElement('div');
      outer.className = 'msg ' + role;
      outer.innerHTML = `
        <div class="avatar">${role === 'user' ? 'You' : 'AI'}</div>
        <div class="bubble-wrap">
          <span class="ts">${time || now()}</span>
          <div class="bubble">${html}</div>
        </div>`;
      log.appendChild(outer);
      log.scrollTop = log.scrollHeight;
    }

    function typingBubble() {
      const outer = document.createElement('div');
      outer.className = 'msg bot';
      outer.id = 'typing-indicator';
      outer.innerHTML = `
        <div class="avatar">AI</div>
        <div class="bubble-wrap">
          <span class="ts">${now()}</span>
          <div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
        </div>`;
      log.appendChild(outer);
      log.scrollTop = log.scrollHeight;
      return outer;
    }

    function buildBotHtml(replyText, wd) {
      let weatherHtml = '';
      if (wd) {
        if (wd.forecast) {
          const items = wd.forecast.map(f => `
            <div class="wc-forecast-item">
              <div class="wc-forecast-time">${utcToLocal(f.time)}</div>
              <div style="font-size:24px;margin:4px 0">${getWeatherEmoji(f.description)}</div>
              <div class="wc-forecast-temp">${Math.round(f.tempCelsius)}°</div>
              <div class="wc-forecast-desc" title="${f.description}">${f.description}</div>
            </div>`).join('');
          weatherHtml = `
            <div class="weather-card">
              <div class="wc-header"><div class="wc-city">${wd.city} Forecast</div></div>
              <div class="wc-forecast">${items}</div>
            </div>`;
        } else {
          weatherHtml = `
            <div class="weather-card">
              <div class="wc-header">
                <div class="wc-city">${wd.city}</div>
                <div class="wc-desc">${wd.description}</div>
              </div>
              <div class="wc-main" style="display:flex;justify-content:space-between;align-items:center;margin:8px 0">
                <div class="wc-temp">${Math.round(wd.tempCelsius)}°C</div>
                <div style="font-size:44px;line-height:1">${getWeatherEmoji(wd.description)}</div>
              </div>
              <div class="wc-details">
                <span>💧 ${wd.humidity}%</span>
                <span>💨 ${wd.windSpeed} m/s</span>
                <span>Feels like ${Math.round(wd.feelsLike)}°C</span>
              </div>
            </div>`;
        }
      }
      return weatherHtml + `<div>${escHtml(replyText)}</div>`;
    }

    // ── Server-side history ──────────────────────────────────────────────────────
    async function loadHistory() {
      try {
        const res = await fetch('/history?page=' + PAGE);
        if (!res.ok) return [];
        return await res.json();
      } catch { return []; }
    }

    async function addToHistory(question, answer, weatherData = null) {
      try {
        await fetch('/history', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ page: PAGE, question, answer, extra: weatherData })
        });
        renderHistory(document.getElementById('hist-search').value);
      } catch { }
    }

    async function deleteHistoryItem(id) {
      try {
        await fetch('/history?id=' + id, { method: 'DELETE' });
        renderHistory(document.getElementById('hist-search').value);
      } catch { }
    }

    async function clearHistory() {
      if (!confirm('Clear all weather chat history?')) return;
      try {
        await fetch('/history?page=' + PAGE, { method: 'DELETE' });
        document.getElementById('hist-search').value = '';
        renderHistory();
      } catch { }
    }

    async function renderHistory(query = '') {
      let entries = await loadHistory();
      if (query) {
        const q = query.toLowerCase();
        entries = entries.filter(e =>
          e.question.toLowerCase().includes(q) || e.answer.toLowerCase().includes(q));
      }
      historyList.innerHTML = '';
      if (!entries.length) {
        historyList.innerHTML = query
          ? '<p class="hist-empty">No matches found.</p>'
          : '<p class="hist-empty">No history yet.<br>Start chatting to see<br>your conversations here.</p>';
        return;
      }
      [...entries].reverse().forEach(entry => {
        const item = document.createElement('div');
        item.className = 'hist-item';
        item.innerHTML = `
          <div class="hist-time">
            <span>${escHtml(entry.time)}</span>
            <button class="hist-del" title="Delete">✖</button>
          </div>
          <div class="hist-q">${escHtml(entry.question)}</div>
          <div class="hist-a">${escHtml(entry.answer)}</div>`;
        item.querySelector('.hist-del').onclick = e => {
          e.stopPropagation();
          deleteHistoryItem(entry.id);
        };
        item.onclick = () => {
          addMsg('user', escHtml(entry.question), entry.time);
          addMsg('bot', buildBotHtml(entry.answer, entry.extra), entry.time);
        };
        historyList.appendChild(item);
      });
    }

    async function doLogout() {
      await fetch('/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    // ── Send ─────────────────────────────────────────────────────────────────────
    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg('user', escHtml(text));
      const indicator = typingBubble();
      btn.disabled = true;

      let rawText = '', weatherData = null;
      const t0 = Date.now();
      try {
        const res = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text }) });
        const data = await res.json();
        rawText = data.reply || data.error || 'No response.';
        weatherData = data.weatherData || null;
      } catch { rawText = 'Could not reach the server.'; }

      const elapsed = Date.now() - t0;
      if (elapsed < 600) await new Promise(r => setTimeout(r, 600 - elapsed));

      indicator.remove();
      addMsg('bot', buildBotHtml(rawText, weatherData));
      addToHistory(text, rawText, weatherData);
      btn.disabled = false;
      input.focus();
    }

    function quickSend(text) { input.value = text; send(); }

    // ── Theme ────────────────────────────────────────────────────────────────────
    function initTheme() {
      if (localStorage.getItem(THEME_KEY) === 'light') {
        document.body.classList.add('light-mode');
        themeBtn.textContent = '🌙';
      }
    }
    function toggleTheme() {
      const light = document.body.classList.toggle('light-mode');
      themeBtn.textContent = light ? '🌙' : '☀️';
      localStorage.setItem(THEME_KEY, light ? 'light' : 'dark');
    }

    // ── Boot ─────────────────────────────────────────────────────────────────────
    initTheme();
    (async () => {
      try {
        const res = await fetch('/auth/me');
        const data = await res.json();
        if (!data.ok) { window.location.href = '/login'; return; }
        document.getElementById('username-display').textContent = '👤 ' + data.username;
      } catch { }
      renderHistory();
      addMsg('bot', 'Hi! Ask me about the weather anywhere in the world.\n\nTry: "What\'s the weather in Paris?" or "Weather in Tokyo for the next 6 hours?"');
    })();
  </script>
</body>

</html>
