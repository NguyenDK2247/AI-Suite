# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── SQLite DataSource ─────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:app.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# ── Schema initialisation ─────────────────────────────────────────────────────
# Run schema.sql on startup to create tables if they don't exist
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=false

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.aisuite=INFO

# ── Static resources (frontend/) ──────────────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# ── API Keys (loaded from environment — set in .env or system env) ────────────
app.groq.api-key=${GROQ_API_KEY}
app.openweather.api-key=${OPENWEATHER_API_KEY}

# ── RAG config ────────────────────────────────────────────────────────────────
app.ollama.url=http://localhost:11434
app.chroma.url=http://[::1]:8000
