# ── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ── Oracle DataSource ─────────────────────────────────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# ── Schema initialiation ─────────────────────────────────────────────────────
# always = run schema.sql on every startup (Oracle ignores errors on existing tables)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
# Oracle uses / as statement separator in schema.sql
spring.sql.init.separator=/
# Continue even if a statement fails (e.g. table already exists on restart)
spring.sql.init.continue-on-error=true

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=false

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.aisuite=INFO

# ── Static resources ──────────────────────────────────────────────────────────
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.add-mappings=false

# ── API Keys (loaded from environment — set in .env or system env) ────────────
app.groq.api-key=${GROQ_API_KEY}
app.openweather.api-key=${OPENWEATHER_API_KEY}

# ── RAG config ────────────────────────────────────────────────────────────────
app.ollama.url=http://[::1]:11434
app.chroma.url=http://[::1]:8000
app.libretranslate.url=http://localhost:5000
