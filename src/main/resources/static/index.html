<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app">

    <!-- ── Left sidebar ─────────────────────────────────────────────────── -->
    <div class="sidebar">
      <div class="sidebar-logo">AI<br><span>Suite</span></div>
      <nav class="sidebar-nav">
        <a class="sidebar-tab active" href="/" title="Weather">
          <span class="tab-icon">🌤️</span>
          <span class="tab-label">Weather</span>
        </a>
        <a class="sidebar-tab" href="/currency" title="Currency">
          <span class="tab-icon">💱</span>
          <span class="tab-label">Currency</span>
        </a>
        <a class="sidebar-tab" href="/translation" title="Translation">
          <span class="tab-icon">🌐</span>
          <span class="tab-label">Translate</span>
        </a>
        <a class="sidebar-tab" href="/knowledge" title="Knowledge">
          <span class="tab-icon">🧠</span>
          <span class="tab-label">Knowledge</span>
        </a>
      </nav>
      <!-- Timezone selector pinned to bottom of sidebar -->
      <div class="sidebar-tz">
        <div class="tz-label">🌐 TZ</div>
        <select id="tz-select" class="tz-select" onchange="onTzChange(this.value)">
          <option value="">Loading…</option>
        </select>
      </div>
    </div>

    <!-- ── Chat panel ────────────────────────────────────────────────────── -->
    <div class="chat-panel">
      <div class="chat-header">
        <div class="status-dot"></div>
        <h1>Weather Assistant</h1>
        <small id="username-display" style="margin-left:auto;margin-right:8px"></small>
        <small id="token-display" style="margin-right:8px;color:var(--muted);font-size:11px"></small>
        <button onclick="doLogout()" class="logout-btn">Logout</button>
      </div>

      <div id="log"></div>

      <div class="chips">
        <span class="chip" onclick="quickSend('What is the weather in Tokyo?')">🗼 Tokyo</span>
        <span class="chip" onclick="quickSend('How is the weather in London right now?')">🇬🇧 London</span>
        <span class="chip" onclick="quickSend('Weather in New York for the next 9 hours')">🗽 New York</span>
        <span class="chip" onclick="quickSend('Weather in Sydney')">🦘 Sydney</span>
        <span class="chip" onclick="quickSend('What is the weather in Hanoi for the next 6 hours?')">🇻🇳 Hanoi</span>
      </div>

      <div class="input-row">
        <input id="input" type="text" placeholder="Ask about weather in any city…" autocomplete="off"
          onkeydown="if(event.key==='Enter') send()" />
        <button id="btn" onclick="send()">Send</button>
      </div>
    </div>

    <!-- ── History panel ─────────────────────────────────────────────────── -->
    <div class="history-panel">
      <div class="history-header">
        <h2>Chat History</h2>
        <div style="display:flex;gap:8px;">
          <button id="theme-btn" onclick="toggleTheme()" title="Toggle theme">☀️</button>
          <button id="clear-btn" onclick="clearHistory()">Clear</button>
        </div>
      </div>
      <div class="persist-badge">Saved per account — weather history</div>
      <div class="hist-search-wrap">
        <input type="text" id="hist-search" class="hist-search" placeholder="Search history…"
          oninput="renderHistory(this.value)" />
      </div>
      <div id="history-list"></div>
    </div>

  </div>

  <script>
    const PAGE = 'weather';
    const THEME_KEY = 'app_theme';
    const TZ_KEY = 'app_timezone';

    const log = document.getElementById('log');
    const input = document.getElementById('input');
    const btn = document.getElementById('btn');
    const historyList = document.getElementById('history-list');
    const themeBtn = document.getElementById('theme-btn');
    const tzSelect = document.getElementById('tz-select');

    // ── Timezone state (set during boot from server) ─────────────────────────────
    let currentTz = localStorage.getItem(TZ_KEY) || 'UTC';
    let sessionTotalTokens = 0;

    // ── Unified time formatters — ALL times on the page go through these ─────────
    function toTZ(utcStr) {
      // Handles both "2026-07-15 11:43:23" (SQLite) and "2026-07-15 14:00:00" (OWM)
      const date = new Date(utcStr.replace(' ', 'T') + 'Z');
      return date.toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', timeZone: currentTz
      });
    }

    function toTZFull(utcStr) {
      const date = new Date(utcStr.replace(' ', 'T') + 'Z');
      return date.toLocaleString([], {
        month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit',
        timeZone: currentTz
      });
    }

    // For the current moment (chat bubble timestamps)
    function nowInTZ() {
      return new Date().toLocaleTimeString([], {
        hour: '2-digit', minute: '2-digit', timeZone: currentTz
      });
    }

    function escHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function updateTokenDisplay(usage) {
      if (!usage) return;
      const todayTotal = usage.todayTotal ?? 0;
      const dailyLimit = usage.dailyLimit ?? 500000;
      const display = document.getElementById('token-display');
      display.textContent =
        `↗ ${fmtTokens(usage.totalTokens)} this msg  |  ${fmtTokens(todayTotal)} / ${fmtTokens(dailyLimit)} today`;
    }

    function updateTokenDisplayFromTotal(todayTotal, dailyLimit) {
      const display = document.getElementById('token-display');
      if (display) display.textContent =
        `${fmtTokens(todayTotal)} / ${fmtTokens(dailyLimit)} tokens used today`;
    }

    function fmtTokens(n) {
      return Number(n).toLocaleString();
    }

    function getWeatherEmoji(desc) {
      const d = desc.toLowerCase();
      if (d.includes('thunderstorm')) return '⛈️';
      if (d.includes('drizzle') || d.includes('rain')) return '🌧️';
      if (d.includes('snow')) return '❄️';
      if (d.includes('clear')) return '☀️';
      if (d.includes('few') || d.includes('scattered')) return '🌤️';
      if (d.includes('clouds')) return '☁️';
      if (d.includes('mist') || d.includes('haze') || d.includes('fog')) return '🌫️';
      return '🌡️';
    }

    // ── Timezone dropdown ────────────────────────────────────────────────────────

    // Returns a string like "UTC+7:00" or "UTC-5:00" for a given IANA timezone
    function utcOffsetLabel(tz) {
      try {
        const parts = new Intl.DateTimeFormat('en', {
          timeZone: tz, timeZoneName: 'shortOffset'
        }).formatToParts(new Date());
        const offset = parts.find(p => p.type === 'timeZoneName')?.value || 'UTC';
        return offset; // e.g. "GMT+7", "GMT-5", "GMT"
      } catch { return 'UTC'; }
    }

    function buildOptions(list) {
      tzSelect.innerHTML = list.map(tz => {
        const offset = utcOffsetLabel(tz);
        const label = tz.replace(/_/g, ' ');
        return `<option value="${tz}" ${tz === currentTz ? 'selected' : ''}>${label} (${offset})</option>`;
      }).join('');
    }

    async function loadTimezones() {
      try {
        const res = await fetch('https://worldtimeapi.org/api/timezone');
        const list = await res.json();
        buildOptions(list);
      } catch {
        const fallback = [
          'UTC', 'America/New_York', 'America/Chicago', 'America/Denver', 'America/Los_Angeles',
          'America/Sao_Paulo', 'Europe/London', 'Europe/Paris', 'Europe/Berlin', 'Europe/Moscow',
          'Africa/Cairo', 'Asia/Dubai', 'Asia/Kolkata', 'Asia/Bangkok', 'Asia/Ho_Chi_Minh',
          'Asia/Shanghai', 'Asia/Tokyo', 'Asia/Seoul', 'Australia/Sydney', 'Pacific/Auckland'
        ];
        buildOptions(fallback);
      }
    }

    async function onTzChange(tz) {
      currentTz = tz;
      localStorage.setItem(TZ_KEY, tz);
      // Persist to server so it syncs across devices
      try {
        await fetch('/user/settings', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ timezone: tz })
        });
      } catch { }
      // Re-render history so all timestamps update immediately
      renderHistory(document.getElementById('hist-search').value);
    }

    // ── Chat rendering ───────────────────────────────────────────────────────────
    function addMsg(role, html, utcStr) {
      const outer = document.createElement('div');
      outer.className = 'msg ' + role;
      // If utcStr provided (replaying history), convert it; else use current moment
      const timeLabel = utcStr ? toTZFull(utcStr) : nowInTZ();
      outer.innerHTML = `
        <div class="avatar">${role === 'user' ? 'You' : 'AI'}</div>
        <div class="bubble-wrap">
          <span class="ts">${timeLabel}</span>
          <div class="bubble">${html}</div>
        </div>`;
      log.appendChild(outer);
      log.scrollTop = log.scrollHeight;
    }

    function typingBubble() {
      const outer = document.createElement('div');
      outer.className = 'msg bot';
      outer.id = 'typing-indicator';
      outer.innerHTML = `
        <div class="avatar">AI</div>
        <div class="bubble-wrap">
          <span class="ts">${nowInTZ()}</span>
          <div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
        </div>`;
      log.appendChild(outer);
      log.scrollTop = log.scrollHeight;
      return outer;
    }

    function buildBotHtml(replyText, wd) {
      let weatherHtml = '';
      if (wd) {
        if (wd.forecast) {
          const items = wd.forecast.map(f => `
            <div class="wc-forecast-item">
              <div class="wc-forecast-time">${toTZ(f.time)}</div>
              <div style="font-size:24px;margin:4px 0">${getWeatherEmoji(f.description)}</div>
              <div class="wc-forecast-temp">${Math.round(f.tempCelsius)}°</div>
              <div class="wc-forecast-desc" title="${f.description}">${f.description}</div>
            </div>`).join('');
          weatherHtml = `
            <div class="weather-card">
              <div class="wc-header"><div class="wc-city">${wd.city} Forecast</div></div>
              <div class="wc-forecast">${items}</div>
            </div>`;
        } else {
          weatherHtml = `
            <div class="weather-card">
              <div class="wc-header">
                <div class="wc-city">${wd.city}</div>
                <div class="wc-desc">${wd.description}</div>
              </div>
              <div class="wc-main" style="display:flex;justify-content:space-between;align-items:center;margin:8px 0">
                <div class="wc-temp">${Math.round(wd.tempCelsius)}°C</div>
                <div style="font-size:44px;line-height:1">${getWeatherEmoji(wd.description)}</div>
              </div>
              <div class="wc-details">
                <span>💧 ${wd.humidity}%</span>
                <span>💨 ${wd.windSpeed} m/s</span>
                <span>Feels like ${Math.round(wd.feelsLike)}°C</span>
              </div>
            </div>`;
        }
      }
      return weatherHtml + `<div>${escHtml(replyText)}</div>`
        + (arguments[2] ? `<div class="token-badge">↗ ${fmtTokens(arguments[2])} tokens</div>` : '');
    }

    // ── Server-side history ──────────────────────────────────────────────────────
    async function loadHistory() {
      try {
        const res = await fetch('/history?page=' + PAGE);
        if (!res.ok) return [];
        return await res.json();
      } catch { return []; }
    }

    async function addToHistory(question, answer, weatherData = null) {
      try {
        await fetch('/history', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ page: PAGE, question, answer, extra: weatherData })
        });
        renderHistory(document.getElementById('hist-search').value);
      } catch { }
    }

    async function deleteHistoryItem(id) {
      try {
        await fetch('/history?id=' + id, { method: 'DELETE' });
        renderHistory(document.getElementById('hist-search').value);
      } catch { }
    }

    async function clearHistory() {
      if (!confirm('Clear all weather chat history?')) return;
      try {
        await fetch('/history?page=' + PAGE, { method: 'DELETE' });
        document.getElementById('hist-search').value = '';
        renderHistory();
      } catch { }
    }

    async function renderHistory(query = '') {
      let entries = await loadHistory();
      if (query) {
        const q = query.toLowerCase();
        entries = entries.filter(e =>
          e.question.toLowerCase().includes(q) || e.answer.toLowerCase().includes(q));
      }
      historyList.innerHTML = '';
      if (!entries.length) {
        historyList.innerHTML = query
          ? '<p class="hist-empty">No matches found.</p>'
          : '<p class="hist-empty">No history yet.<br>Start chatting to see<br>your conversations here.</p>';
        return;
      }
      [...entries].reverse().forEach(entry => {
        const item = document.createElement('div');
        item.className = 'hist-item';
        // Convert UTC timestamp from SQLite to the chosen timezone
        const displayTime = toTZFull(entry.time);
        item.innerHTML = `
          <div class="hist-time">
            <span>${displayTime}</span>
            <button class="hist-del" title="Delete">✖</button>
          </div>
          <div class="hist-q">${escHtml(entry.question)}</div>
          <div class="hist-a">${escHtml(entry.answer)}</div>`;
        item.querySelector('.hist-del').onclick = e => {
          e.stopPropagation();
          deleteHistoryItem(entry.id);
        };
        item.onclick = () => {
          addMsg('user', escHtml(entry.question), entry.time);
          addMsg('bot', buildBotHtml(entry.answer, entry.extra), entry.time);
        };
        historyList.appendChild(item);
      });
    }

    async function doLogout() {
      await fetch('/auth/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    // ── Send ─────────────────────────────────────────────────────────────────────
    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg('user', escHtml(text));
      const indicator = typingBubble();
      btn.disabled = true;

      let rawText = '', weatherData = null, tokenUsage = null;
      const t0 = Date.now();
      try {
        const res = await fetch('/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        rawText = data.reply || data.error || 'No response.';
        weatherData = data.weatherData || null;
        tokenUsage = data.tokenUsage || null;
      } catch { rawText = 'Could not reach the server.'; }

      const elapsed = Date.now() - t0;
      if (elapsed < 600) await new Promise(r => setTimeout(r, 600 - elapsed));

      indicator.remove();
      addMsg('bot', buildBotHtml(rawText, weatherData, tokenUsage?.totalTokens));
      updateTokenDisplay(tokenUsage);
      addToHistory(text, rawText, weatherData);
      btn.disabled = false;
      input.focus();
    }

    function quickSend(text) { input.value = text; send(); }

    // ── Theme ────────────────────────────────────────────────────────────────────
    function initTheme() {
      if (localStorage.getItem(THEME_KEY) === 'light') {
        document.body.classList.add('light-mode');
        themeBtn.textContent = '🌙';
      }
    }
    function toggleTheme() {
      const light = document.body.classList.toggle('light-mode');
      themeBtn.textContent = light ? '🌙' : '☀️';
      localStorage.setItem(THEME_KEY, light ? 'light' : 'dark');
    }

    // ── Boot ─────────────────────────────────────────────────────────────────────
    initTheme();
    (async () => {
      try {
        // 1. Verify session and get username
        const meRes = await fetch('/auth/me');
        const meData = await meRes.json();
        if (!meData.ok) { window.location.href = '/login'; return; }
        document.getElementById('username-display').textContent = '👤 ' + meData.username;

        // 2. Load saved timezone from server (overrides localStorage if different)
        const tzRes = await fetch('/user/settings');
        const tzData = await tzRes.json();
        if (tzData.ok && tzData.timezone) {
          currentTz = tzData.timezone;
          localStorage.setItem(TZ_KEY, currentTz);
        }

        // 3. Load today's token usage
        const tkRes = await fetch('/tokens');
        const tkData = await tkRes.json();
        updateTokenDisplayFromTotal(tkData.todayTotal, tkData.dailyLimit);
      } catch { }

      // 4. Populate timezone dropdown (uses currentTz to pre-select correct option)
      await loadTimezones();

      // 4. Load history and welcome message
      renderHistory();
      addMsg('bot', 'Hi! Ask me about the weather anywhere in the world.\n\nTry: "What\'s the weather in Paris?" or "Weather in Tokyo for the next 6 hours?"');
    })();
  </script>
</body>

</html>
