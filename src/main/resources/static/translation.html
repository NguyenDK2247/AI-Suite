<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Translation Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="app">

        <!-- ── Left sidebar ─────────────────────────────────────────────────── -->
        <div class="sidebar">
            <div class="sidebar-logo">AI<br><span>Suite</span></div>
            <nav class="sidebar-nav">
                <a class="sidebar-tab" href="/" title="Weather">
                    <span class="tab-icon">🌤️</span>
                    <span class="tab-label">Weather</span>
                </a>
                <a class="sidebar-tab" href="/currency" title="Currency">
                    <span class="tab-icon">💱</span>
                    <span class="tab-label">Currency</span>
                </a>
                <a class="sidebar-tab active" href="/translation" title="Translation">
                    <span class="tab-icon">🌐</span>
                    <span class="tab-label">Translate</span>
                </a>
                <a class="sidebar-tab" href="/knowledge" title="Knowledge">
                    <span class="tab-icon">🧠</span>
                    <span class="tab-label">Knowledge</span>
                </a>
            </nav>
            <div class="sidebar-tz">
                <div class="tz-label">🌐 TZ</div>
                <select id="tz-select" class="tz-select" onchange="onTzChange(this.value)">
                    <option value="">UTC</option>
                </select>
            </div>
        </div>

        <!-- ── Chat panel ────────────────────────────────────────────────────── -->
        <div class="chat-panel">
            <div class="chat-header">
                <div class="status-dot" style="background:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.18)"></div>
                <h1>Translation Assistant</h1>
                <small id="username-display" style="margin-left:auto;margin-right:8px"></small>
                <small id="token-display" style="margin-right:8px;color:var(--muted);font-size:11px"></small>
                <button onclick="doLogout()" class="logout-btn">Logout</button>
            </div>

            <div id="log"></div>

            <div class="chips">
                <span class="chip" onclick="quickSend('Translate &quot;hello&quot; to Vietnamese')">🇻🇳 →
                    Vietnamese</span>
                <span class="chip" onclick="quickSend('Translate &quot;xin chào&quot; to English')">🇬🇧 →
                    English</span>
                <span class="chip" onclick="quickSend('How do you say &quot;thank you&quot; in Japanese?')">🇯🇵 →
                    Japanese</span>
                <span class="chip" onclick="quickSend('Translate &quot;good morning&quot; to French')">🇫🇷 →
                    French</span>
                <span class="chip" onclick="quickSend('Translate &quot;bonjour&quot; to Spanish')">🇪🇸 → Spanish</span>
            </div>

            <div class="input-row">
                <input id="input" type="text" placeholder='Try: Translate "hello world" to Vietnamese'
                    autocomplete="off" onkeydown="if(event.key==='Enter') send()" />
                <button id="btn" onclick="send()">Send</button>
            </div>
        </div>

        <!-- ── History panel ─────────────────────────────────────────────────── -->
        <div class="history-panel">
            <div class="history-header">
                <h2>Chat History</h2>
                <div style="display:flex;gap:8px;">
                    <button id="theme-btn" onclick="toggleTheme()" title="Toggle theme">☀️</button>
                    <button id="clear-btn" onclick="clearHistory()">Clear</button>
                </div>
            </div>
            <div class="persist-badge"
                style="background:rgba(139,92,246,.08);border-color:rgba(139,92,246,.2);color:#a78bfa;">
                Saved per account — translation history
            </div>
            <div class="hist-search-wrap">
                <input type="text" id="hist-search" class="hist-search" placeholder="Search history…"
                    oninput="renderHistory(this.value)" />
            </div>
            <div id="history-list"></div>
        </div>

    </div>

    <style>
        /* ── Translation card ───────────────────────────────────────────────── */
        .translation-card {
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            color: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .15);
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 360px;
        }

        .tc-langs {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            opacity: .9;
        }

        .tc-lang {
            background: rgba(255, 255, 255, .2);
            padding: 3px 10px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: .3px;
        }

        .tc-arrow {
            font-size: 16px;
        }

        .tc-original {
            font-size: 13px;
            opacity: .85;
            font-style: italic;
            border-left: 2px solid rgba(255, 255, 255, .4);
            padding-left: 10px;
        }

        .tc-translated {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -.3px;
        }

        .tc-source {
            font-size: 10px;
            opacity: .6;
            margin-top: 2px;
        }
    </style>

    <script>
        const PAGE = 'translation';
        const THEME_KEY = 'app_theme';
        const TZ_KEY = 'app_timezone';

        const log = document.getElementById('log');
        const input = document.getElementById('input');
        const btn = document.getElementById('btn');
        const historyList = document.getElementById('history-list');
        const themeBtn = document.getElementById('theme-btn');
        const tzSelect = document.getElementById('tz-select');

        let currentTz = localStorage.getItem(TZ_KEY) || 'UTC';
        let sessionTotalTokens = 0;

        // ── Time helpers ─────────────────────────────────────────────────────────
        function toTZFull(utcStr) {
            const date = new Date(utcStr.replace(' ', 'T') + 'Z');
            return date.toLocaleString([], {
                month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit', timeZone: currentTz
            });
        }
        function nowInTZ() {
            return new Date().toLocaleTimeString([], {
                hour: '2-digit', minute: '2-digit', timeZone: currentTz
            });
        }
        function escHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function fmtTokens(n) { return Number(n).toLocaleString(); }

        function updateTokenDisplay(usage) {
            if (!usage) return;
            const todayTotal = usage.todayTotal ?? 0;
            const dailyLimit = usage.dailyLimit ?? 500000;
            const display = document.getElementById('token-display');
            display.textContent =
                `↗ ${fmtTokens(usage.totalTokens)} this msg  |  ${fmtTokens(todayTotal)} / ${fmtTokens(dailyLimit)} today`;
        }

        function updateTokenDisplayFromTotal(todayTotal, dailyLimit) {
            const display = document.getElementById('token-display');
            if (display) display.textContent =
                `${fmtTokens(todayTotal)} / ${fmtTokens(dailyLimit)} tokens used today`;
        }

        // ── Translation card builder ─────────────────────────────────────────────
        function buildBotHtml(replyText, td) {
            let cardHtml = '';
            if (td) {
                cardHtml = `
          <div class="translation-card">
            <div class="tc-langs">
              <span class="tc-lang">${escHtml(td.sourceLangName)}</span>
              <span class="tc-arrow">→</span>
              <span class="tc-lang">${escHtml(td.targetLangName)}</span>
            </div>
            <div class="tc-original">"${escHtml(td.originalText)}"</div>
            <div class="tc-translated">${escHtml(td.translatedText)}</div>
            <div class="tc-source">Powered by LibreTranslate</div>
          </div>`;
            }
            return cardHtml + `<div>${escHtml(replyText)}</div>`
                + (arguments[2] ? `<div class="token-badge">↗ ${fmtTokens(arguments[2])} tokens</div>` : '');
        }

        // ── Chat rendering ────────────────────────────────────────────────────────
        function addMsg(role, html, utcStr) {
            const outer = document.createElement('div');
            outer.className = 'msg ' + role;
            const timeLabel = utcStr ? toTZFull(utcStr) : nowInTZ();
            outer.innerHTML = `
        <div class="avatar">${role === 'user' ? 'You' : 'AI'}</div>
        <div class="bubble-wrap">
          <span class="ts">${timeLabel}</span>
          <div class="bubble">${html}</div>
        </div>`;
            log.appendChild(outer);
            log.scrollTop = log.scrollHeight;
        }

        function typingBubble() {
            const outer = document.createElement('div');
            outer.className = 'msg bot';
            outer.id = 'typing-indicator';
            outer.innerHTML = `
        <div class="avatar">AI</div>
        <div class="bubble-wrap">
          <span class="ts">${nowInTZ()}</span>
          <div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>
        </div>`;
            log.appendChild(outer);
            log.scrollTop = log.scrollHeight;
            return outer;
        }

        // ── Server-side history ───────────────────────────────────────────────────
        async function loadHistory() {
            try {
                const res = await fetch('/history?page=' + PAGE);
                if (!res.ok) return [];
                return await res.json();
            } catch { return []; }
        }
        async function addToHistory(question, answer, translationData = null) {
            try {
                await fetch('/history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page: PAGE, question, answer, extra: translationData })
                });
                renderHistory(document.getElementById('hist-search').value);
            } catch { }
        }
        async function deleteHistoryItem(id) {
            try {
                await fetch('/history?id=' + id, { method: 'DELETE' });
                renderHistory(document.getElementById('hist-search').value);
            } catch { }
        }
        async function clearHistory() {
            if (!confirm('Clear all translation history?')) return;
            try {
                await fetch('/history?page=' + PAGE, { method: 'DELETE' });
                document.getElementById('hist-search').value = '';
                renderHistory();
            } catch { }
        }
        async function renderHistory(query = '') {
            let entries = await loadHistory();
            if (query) {
                const q = query.toLowerCase();
                entries = entries.filter(e =>
                    e.question.toLowerCase().includes(q) || e.answer.toLowerCase().includes(q));
            }
            historyList.innerHTML = '';
            if (!entries.length) {
                historyList.innerHTML = query
                    ? '<p class="hist-empty">No matches found.</p>'
                    : '<p class="hist-empty">No history yet.<br>Try translating something!</p>';
                return;
            }
            [...entries].reverse().forEach(entry => {
                const item = document.createElement('div');
                item.className = 'hist-item';
                item.innerHTML = `
          <div class="hist-time">
            <span>${toTZFull(entry.time)}</span>
            <button class="hist-del" title="Delete">✖</button>
          </div>
          <div class="hist-q">${escHtml(entry.question)}</div>
          <div class="hist-a">${escHtml(entry.answer)}</div>`;
                item.querySelector('.hist-del').onclick = e => {
                    e.stopPropagation();
                    deleteHistoryItem(entry.id);
                };
                item.onclick = () => {
                    addMsg('user', escHtml(entry.question), entry.time);
                    addMsg('bot', buildBotHtml(entry.answer, entry.extra), entry.time);
                };
                historyList.appendChild(item);
            });
        }

        // ── Timezone ──────────────────────────────────────────────────────────────
        function utcOffsetLabel(tz) {
            try {
                const parts = new Intl.DateTimeFormat('en', {
                    timeZone: tz, timeZoneName: 'shortOffset'
                }).formatToParts(new Date());
                return parts.find(p => p.type === 'timeZoneName')?.value || 'UTC';
            } catch { return 'UTC'; }
        }
        async function loadTimezones() {
            try {
                const res = await fetch('https://worldtimeapi.org/api/timezone');
                const list = await res.json();
                tzSelect.innerHTML = list.map(tz => {
                    const label = tz.replace(/_/g, ' ');
                    return `<option value="${tz}" ${tz === currentTz ? 'selected' : ''}>${label} (${utcOffsetLabel(tz)})</option>`;
                }).join('');
            } catch {
                const fallback = ['UTC', 'America/New_York', 'Europe/London', 'Asia/Ho_Chi_Minh', 'Asia/Tokyo'];
                tzSelect.innerHTML = fallback.map(tz =>
                    `<option value="${tz}" ${tz === currentTz ? 'selected' : ''}>${tz.replace(/_/g, ' ')} (${utcOffsetLabel(tz)})</option>`
                ).join('');
            }
        }
        async function onTzChange(tz) {
            currentTz = tz;
            localStorage.setItem(TZ_KEY, tz);
            try {
                await fetch('/user/settings', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ timezone: tz })
                });
            } catch { }
            renderHistory(document.getElementById('hist-search').value);
        }

        // ── Send ──────────────────────────────────────────────────────────────────
        async function send() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            addMsg('user', escHtml(text));
            const indicator = typingBubble();
            btn.disabled = true;

            let rawText = '', translationData = null, tokenUsage = null;
            const t0 = Date.now();
            try {
                const res = await fetch('/translate-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                rawText = data.reply || data.error || 'No response.';
                translationData = data.translationData || null;
                tokenUsage = data.tokenUsage || null;
            } catch { rawText = 'Could not reach the server.'; }

            const elapsed = Date.now() - t0;
            if (elapsed < 600) await new Promise(r => setTimeout(r, 600 - elapsed));

            indicator.remove();
            addMsg('bot', buildBotHtml(rawText, translationData, tokenUsage?.totalTokens));
            updateTokenDisplay(tokenUsage);
            addToHistory(text, rawText, translationData);
            btn.disabled = false;
            input.focus();
        }

        function quickSend(text) { input.value = text; send(); }

        async function doLogout() {
            await fetch('/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        // ── Theme ─────────────────────────────────────────────────────────────────
        function initTheme() {
            if (localStorage.getItem(THEME_KEY) === 'light') {
                document.body.classList.add('light-mode');
                themeBtn.textContent = '🌙';
            }
        }
        function toggleTheme() {
            const light = document.body.classList.toggle('light-mode');
            themeBtn.textContent = light ? '🌙' : '☀️';
            localStorage.setItem(THEME_KEY, light ? 'light' : 'dark');
        }

        // ── Boot ──────────────────────────────────────────────────────────────────
        initTheme();
        (async () => {
            try {
                const meRes = await fetch('/auth/me');
                const meData = await meRes.json();
                if (!meData.ok) { window.location.href = '/login'; return; }
                document.getElementById('username-display').textContent = '👤 ' + meData.username;
                const tzRes = await fetch('/user/settings');
                const tzData = await tzRes.json();
                if (tzData.ok && tzData.timezone) {
                    currentTz = tzData.timezone;
                    localStorage.setItem(TZ_KEY, currentTz);
                }

                const tkRes = await fetch('/tokens');
                const tkData = await tkRes.json();
                updateTokenDisplayFromTotal(tkData.todayTotal, tkData.dailyLimit);
            } catch { }
            await loadTimezones();
            renderHistory();
            addMsg('bot', 'Hi! I can translate text between languages.\n\nTry: "Translate \'hello\' to Vietnamese" or "How do you say \'thank you\' in Japanese?"');
        })();
    </script>
</body>

</html>
