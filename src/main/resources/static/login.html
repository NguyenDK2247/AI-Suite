<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — AI Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/auth.css" />
</head>

<body>
    <div class="auth-card">

        <div class="auth-logo">
            <div class="auth-logo-icon">🤖</div>
            <h1>Welcome back</h1>
            <p>Sign in to your AI Suite account</p>
        </div>

        <div class="banner error" id="error-banner"></div>

        <div class="auth-form">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="your_username" autocomplete="username"
                    autocapitalize="none" />
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
            </div>

            <!-- Remember me + theme toggle row -->
            <div class="form-row">
                <label class="remember-label">
                    <span class="custom-checkbox">
                        <input type="checkbox" id="remember-me" />
                        <span class="checkmark"></span>
                    </span>
                    Remember me for 30 days
                </label>
                <button type="button" class="theme-toggle" id="theme-btn" onclick="toggleTheme()"
                    title="Toggle dark/light mode"></button>
            </div>

            <button class="auth-btn" id="login-btn" onclick="doLogin()">Sign in</button>
        </div>

        <div class="auth-footer">
            Don't have an account? <a href="/signup">Sign up</a>
        </div>

    </div>

    <script>
        const THEME_KEY = 'app_theme';
        const usernameEl = document.getElementById('username');
        const passwordEl = document.getElementById('password');
        const rememberEl = document.getElementById('remember-me');
        const loginBtn = document.getElementById('login-btn');
        const errorBanner = document.getElementById('error-banner');
        const themeBtn = document.getElementById('theme-btn');

        // ── Theme — runs before paint to avoid flash ─────────────────────────────
        (function initTheme() {
            const saved = localStorage.getItem(THEME_KEY);
            // Default to dark; switch to light only if explicitly saved
            if (saved === 'light') {
                document.body.classList.add('light-mode');
                themeBtn.textContent = '🌙';
            } else {
                themeBtn.textContent = '☀️';
            }
        })();

        function toggleTheme() {
            const light = document.body.classList.toggle('light-mode');
            themeBtn.textContent = light ? '🌙' : '☀️';
            localStorage.setItem(THEME_KEY, light ? 'light' : 'dark');
        }

        // ── Enter key support ────────────────────────────────────────────────────
        [usernameEl, passwordEl].forEach(el =>
            el.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));

        function showError(msg) {
            errorBanner.textContent = msg;
            errorBanner.className = 'banner error show';
        }

        function clearError() {
            errorBanner.className = 'banner error';
            usernameEl.classList.remove('error');
            passwordEl.classList.remove('error');
        }

        async function doLogin() {
            clearError();
            const username = usernameEl.value.trim();
            const password = passwordEl.value;
            const rememberMe = rememberEl.checked;

            if (!username) { usernameEl.classList.add('error'); showError('Please enter your username.'); usernameEl.focus(); return; }
            if (!password) { passwordEl.classList.add('error'); showError('Please enter your password.'); passwordEl.focus(); return; }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in…';

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Pass rememberMe so the server sets the right cookie Max-Age
                    body: JSON.stringify({ username, password, rememberMe })
                });
                const data = await res.json();

                if (data.ok) {
                    window.location.href = '/';
                } else {
                    showError(data.error || 'Login failed.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign in';
                }
            } catch {
                showError('Could not reach the server. Please try again.');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign in';
            }
        }
    </script>
</body>

</html>
